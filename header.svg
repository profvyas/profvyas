<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shubham Vyas — Co-founder and CEO at FilFlo, the Anti-ERP for quick-commerce brands">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- faint baseline grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="244" x2="1120" y2="244"/>
  </g>

  <!-- right-side replenishment / inventory motif -->
  <g opacity="0.9">
    <rect x="900"  y="174" width="22" height="70"  rx="5" fill="#334155"/>
    <rect x="938"  y="138" width="22" height="106" rx="5" fill="#3b557e"/>
    <rect x="976"  y="186" width="22" height="58"  rx="5" fill="#334155"/>
    <rect x="1014" y="118" width="22" height="126" rx="5" fill="url(#bar)"/>
    <rect x="1052" y="150" width="22" height="94"  rx="5" fill="#3b557e"/>
    <rect x="1090" y="96"  width="22" height="148" rx="5" fill="url(#bar)"/>
  </g>

  <!-- accent rule -->
  <rect x="80" y="92" width="6" height="116" rx="3" fill="#60a5fa"/>

  <!-- text block -->
  <text x="112" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#f1f5f9" letter-spacing="0.5">Shubham Vyas</text>
  <text x="114" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#60a5fa">Co-founder &amp; CEO @ FilFlo</text>
  <text x="114" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">The Anti-ERP for India's quick-commerce brands</text>
</svg>
